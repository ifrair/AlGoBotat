# nginx.conf with JWT verification via njs
# Uses nginx + njs module for JWT validation

load_module modules/ngx_http_js_module.so;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    js_import /etc/nginx/njs/jwt.js;
    js_set $jwt_payload    jwt_verify_token;
    js_set $jwt_user_id    jwt_get_user_id;
    js_set $jwt_role       jwt_get_role;
    js_set $admin_valid    validate_admin;

    upstream auth_service {
        server auth_service:8000;
    }

    upstream user_service {
        server user_service:8000;
    }

    upstream course_service {
        server course_service:8000;
    }

    upstream content_service {
        server content_service:8000;
    }

    upstream submission_service {
        server submission_service:8000;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'user_id="$jwt_user_id" role="$jwt_role"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Shared proxy headers
    map $upstream_name $proxy_headers {
        default "";
    }

    server {
        listen 80;
        server_name localhost;
        charset utf-8;

        location = /_validate_jwt {
            internal;
            if ($jwt_payload = "0") {
                return 401;
            }
            return 200;
        }

        location = /_validate_admin {
            internal;
            if ($admin_valid = "0") {
                return 401;
            }
            return 200;
        }

        # ============================================================
        # AUTH SERVICE — public (no JWT)
        # ============================================================

        location = /api/v1/auth/login {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================================
        # AUTH SERVICE — JWT-protected
        # ============================================================

        location /api/v1/auth/ {
            auth_request /_validate_jwt;

            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-ID $jwt_user_id;
            proxy_set_header X-User-Role $jwt_role;
        }

        # ============================================================
        # USER SERVICE — JWT-protected
        # ============================================================

        location /api/v1/user {
            auth_request /_validate_jwt;

            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-ID $jwt_user_id;
            proxy_set_header X-User-Role $jwt_role;
        }

        location /api/v1/course_assignment {
            auth_request /_validate_jwt;

            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-ID $jwt_user_id;
            proxy_set_header X-User-Role $jwt_role;
        }

        # ============================================================
        # COURSE SERVICE — JWT-protected
        # ============================================================

        location /api/v1/courses/ {
            auth_request /_validate_jwt;

            proxy_pass http://course_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-ID $jwt_user_id;
            proxy_set_header X-User-Role $jwt_role;
        }

        # ============================================================
        # CONTENT SERVICE — JWT-protected
        # ============================================================

        location /api/v1/content/ {
            auth_request /_validate_jwt;

            proxy_pass http://content_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-ID $jwt_user_id;
            proxy_set_header X-User-Role $jwt_role;
        }

        # ============================================================
        # SUBMISSION SERVICE — JWT-protected
        # ============================================================

        location /api/v1/submissions/ {
            auth_request /_validate_jwt;

            proxy_pass http://submission_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-ID $jwt_user_id;
            proxy_set_header X-User-Role $jwt_role;
        }

        # ============================================================
        # ADMIN ROUTES — require Basic Auth
        # ============================================================

        location /api/v1/admin/ {
            auth_request /_validate_admin;

            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Role 'ADMIN';
        }

        # ============================================================
        # INTERNAL — no auth
        # ============================================================

        location /internal/ {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================================
        # HEALTH CHECK
        # ============================================================

        location = /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ============================================================
        # DEFAULT — 404
        # ============================================================

        location / {
            return 404;
        }
    }
}
